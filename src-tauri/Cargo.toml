[package]
name = "ml-tauri-poc"
version = "4.2.1"
description = "ML-Launcher POC with Tauri + Rust"
edition = "2021"

[lib]
name = "ml_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tokio = { version = "1", features = ["full"] }

# Minecraft auth libraries
minecraft-msa-auth = "0.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "gzip", "brotli", "rustls-tls"] }
urlencoding = "2"

# Pre-added for the launch (Track A) and cloud-sync (Track B) migration tasks
# so neither track needs to edit Cargo.toml.
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = "2"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
rfd = "0.14"
discord-rich-presence = "0.2"
dunce = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
fs4 = "0.13"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
